services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules # Para evitar que el node_modules local toque el de la app
    profiles:
      - dev

  prod:
    build:
      context: .
      target: prod
    ports:
      - "80:80"
    profiles:
      - prod