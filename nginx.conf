server {
    listen 80;
    server_name localhost;

    # Servir los archivos estáticos y resolver rutas de la SPA
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend de Django
    location /api/ {
        # 'ctv' es el nombre del servicio en la red de Docker Compose
        proxy_pass http://ctv:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Silenciar logs molestos de favicon faltante
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
